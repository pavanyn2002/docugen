name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Docgen ships to developers on different operating systems and supported
      # Node versions. Every combination must pass the same source-level suite.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Vitest 4's Rolldown dependency requires Node 20.19+, so the source
        # suite runs on supported toolchain lines. The packed artifact has a
        # separate Node 20.11 runtime smoke test below.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    name: Packed package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

      # The tarball must contain a working binary and its prompt pack.
      - name: Verify the published artifact runs
        shell: bash
        run: |
          npm pack --workspace @pavanyn/docugen --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/pavanyn-docugen-*.tgz
          npx docgen --version
          npx docgen extract --cwd "$GITHUB_WORKSPACE" --dry-run
          npx docgen bootstrap --cwd "$GITHUB_WORKSPACE" --dry-run

  node-20-runtime:
    name: Packed runtime / Node 20.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack --workspace @pavanyn/docugen --pack-destination "$RUNNER_TEMP"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.11'
      - name: Verify the packed CLI on the minimum supported runtime
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-consumer" && cd "$RUNNER_TEMP/runtime-consumer"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/pavanyn-docugen-*.tgz
          npx docgen --version
          npx docgen extract --cwd "$GITHUB_WORKSPACE" --dry-run

  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Docgen's own governed baseline is current
        run: node packages/docgen/dist/cli.js check --quiet

      - name: Generated output is byte-identical across runs
        run: |
          node packages/docgen/dist/cli.js extract --cwd packages/docgen/tests/fixtures/express-service --quiet
          cp -r packages/docgen/tests/fixtures/express-service/docs/generated /tmp/first
          node packages/docgen/dist/cli.js extract --cwd packages/docgen/tests/fixtures/express-service --quiet
          diff -r /tmp/first packages/docgen/tests/fixtures/express-service/docs/generated

      - name: The CI gate agrees with what extract just wrote
        run: node packages/docgen/dist/cli.js check --cwd packages/docgen/tests/fixtures/express-service --quiet

      - name: Status reports honestly on a repo with no cards
        run: |
          node packages/docgen/dist/cli.js status --cwd packages/docgen/tests/fixtures/express-service --json > /tmp/status.json
          grep -q '"described": 0' /tmp/status.json

      - name: A missing working directory fails
        run: |
          if node packages/docgen/dist/cli.js status --cwd /nonexistent-repo --quiet; then
            echo "expected a non-zero exit for a missing root"; exit 1
          fi

      - name: Sync is a no-op on already-current output
        run: |
          node packages/docgen/dist/cli.js sync --cwd packages/docgen/tests/fixtures/express-service --json > /tmp/sync.json
          grep -q '"written": \[\]' /tmp/sync.json
