name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      # npm trusted publishing requires npm 11.5.1 or newer. Pin the minimum
      # supported client instead of relying on the runner's bundled version.
      - name: Install trusted-publishing npm client
        run: npm install --global npm@11.5.1

      - name: Verify release tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/docgen/package.json').version")
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Inspect publish contents
        run: npm pack --workspace @pavanyn/docugen --dry-run

      - name: Generate release SBOM
        run: node packages/docgen/dist/cli.js security sbom --out artifacts/docgen-${{ github.ref_name }}.cdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docgen-${{ github.ref_name }}-sbom
          path: artifacts/*.cdx.json
          if-no-files-found: error

      # A brand-new npm package has no settings page on which to configure a
      # trusted publisher. Allow one owner-created granular token to bootstrap
      # the package, then remove NPM_TOKEN after configuring this workflow as
      # the package's trusted publisher. Both paths produce provenance.
      - name: Detect initial-publication token
        id: npm-bootstrap
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package with initial-publication token
        if: steps.npm-bootstrap.outputs.enabled == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace @pavanyn/docugen --access public --provenance

      - name: Publish package with trusted publishing
        if: steps.npm-bootstrap.outputs.enabled != 'true'
        run: npm publish --workspace @pavanyn/docugen --access public --provenance

      - name: Create GitHub release and attach SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          artifacts/docgen-${{ github.ref_name }}.cdx.json
          --title "Docugen ${{ github.ref_name }}"
          --notes-file CHANGELOG.md
          --verify-tag
